<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>המשימות שלי V1.4</title><style>body{font-family:Arial,sans-serif;background:#f3f6fa;color:#19283d;margin:0}main{max-width:900px;margin:25px auto;padding:15px}section{background:white;border-radius:15px;padding:20px;margin:15px 0;box-shadow:0 2px 10px #152a4510}input,textarea,select,button{font:inherit;padding:11px;border:1px solid #cdd6e2;border-radius:8px;box-sizing:border-box}input,textarea{width:100%;margin:6px 0}button{cursor:pointer;background:#174e89;color:white;border:0}button.secondary{background:#e8edf4;color:#173554}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#eaf1f9;border:0;color:#1a365a;padding:15px}.stat b{display:block;font-size:24px}.task{border-top:1px solid #e3e7ec;padding:14px 0}.muted{color:#65758b;font-size:13px}.hidden{display:none}#message{white-space:pre-wrap}.danger{color:#b12626}textarea{min-height:65px}h1{margin-bottom:5px}@media(max-width:550px){.row{display:block}.row>*{margin:5px 0;width:100%}}</style></head><body><main><h1>המשימות שלי <small class="muted">V1.4</small></h1><p class="muted">ניהול משימות עם שמירה מאובטחת ב־Supabase</p><section id="auth" class="hidden"><h2>התחברות</h2><input id="email" type="email" placeholder="כתובת אימייל"><input id="password" type="password" placeholder="סיסמה"><div class="row"><button id="login">התחבר</button></div></section><div id="app" class="hidden"><section><div class="row"><span id="signedIn"></span><button id="logout" class="secondary">התנתק</button></div></section><section><div class="stats" id="stats"></div></section><section><h2>הוספת משימה</h2><input id="title" placeholder="מה צריך לעשות?"><textarea id="description" placeholder="תיאור (לא חובה)"></textarea><button id="add">הוסף משימה</button></section><section><div class="row"><h2>רשימת משימות</h2><button id="all" class="secondary">הצג הכל</button><button id="refresh" class="secondary">רענן</button></div><div id="tasks"></div></section><section><h2>דוח פעילות</h2><div class="row"><select id="period"><option value="day">יומי</option><option value="week">שבועי</option><option value="month" selected>חודשי</option></select><input type="date" id="reportDate"><button id="generate">הפק דוח</button></div><p class="muted">משימות שהושלמו בתקופה, לצד תמונת מצב נוכחית של משימות פעילות. ללא יומן טיפול, לא ניתן לקבוע אילו משימות פעילות טופלו בפועל בתקופה.</p><textarea id="report" readonly style="min-height:230px" placeholder="הדוח יוצג כאן"></textarea><button id="copyReport" class="secondary">העתק דוח</button></section></div><section id="message" class="muted" role="status"></section></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const PROJECT_URL='https://jufeshcirjwpeseyaxow.supabase.co';
// Set the publishable key once here before uploading to GitHub Pages.
const PUBLISHABLE_KEY='PASTE_YOUR_SB_PUBLISHABLE_KEY_HERE';const $=id=>document.getElementById(id);let client=null,user=null,filter='הכל',items=[];
function msg(t,error=false){$('message').textContent=t;$('message').className=error?'danger':'muted'}
function show(id){for(const x of ['auth','app'])$(x).classList.toggle('hidden',x!==id)}
function connect(){
  if(!PUBLISHABLE_KEY.startsWith('sb_publishable_') && !PUBLISHABLE_KEY.startsWith('eyJ')){
    show('auth');
    $('login').disabled=true;
    msg('חסר Publishable key בקובץ index.html. יש להגדיר אותו פעם אחת בקוד לפני הפרסום.',true);
    return;
  }
  try{
    client=createClient(PROJECT_URL,PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    show('auth');
    client.auth.getUser().then(({data,error})=>{
      if(!error&&data.user)ready(data.user);
      else if(error)msg('יש להתחבר באמצעות מייל וסיסמה');
    }).catch(e=>msg(e.message,true));
  }catch(e){show('auth');msg('שגיאת חיבור: '+e.message,true)}
}
$('login').onclick=async()=>{msg('מתחבר...');const {data,error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return msg(error.message,true);$('password').value='';ready(data.user)};
async function ready(u){user=u;show('app');$('signedIn').textContent=u.email;msg('מחובר');await load()}
$('logout').onclick=async()=>{await client.auth.signOut();user=null;items=[];show('auth');msg('התנתקת בהצלחה')};
async function load(){const {data,error}=await client.from('tasks').select('*').order('created_at',{ascending:false});if(error)return msg('שגיאה בקריאת משימות: '+error.message,true);items=data||[];render()}
function render(){const statuses=['בטיפול','ממתין','הושלם'];$('stats').replaceChildren();for(const s of statuses){const b=document.createElement('button');b.className='stat';const n=document.createElement('b');n.textContent=items.filter(x=>x.status===s).length;b.append(n,document.createTextNode(s));b.onclick=()=>{filter=s;render()};$('stats').append(b)}$('tasks').replaceChildren();const visible=items.filter(x=>filter==='הכל'||x.status===filter);if(!visible.length){$('tasks').textContent='אין משימות להצגה';return}for(const t of visible){const div=document.createElement('div');div.className='task';const h=document.createElement('strong');h.textContent=t.title;const p=document.createElement('p');p.textContent=t.description||'';const small=document.createElement('div');small.className='muted';small.textContent='נפתחה: '+new Date(t.created_at).toLocaleString('he-IL');const r=document.createElement('div');r.className='row';const sel=document.createElement('select');for(const s of statuses){const o=document.createElement('option');o.textContent=s;o.value=s;sel.append(o)}sel.value=t.status;sel.onchange=async()=>{const status=sel.value;const {error}=await client.from('tasks').update({status,completed_at:status==='הושלם'?new Date().toISOString():null,updated_at:new Date().toISOString()}).eq('id',t.id);if(error)msg(error.message,true);else await load()};const log=document.createElement('button');log.textContent='תעד טיפול';log.className='secondary';log.onclick=()=>activity(t);const del=document.createElement('button');del.textContent='מחק';del.className='secondary';del.onclick=async()=>{if(!confirm('למחוק את המשימה וכל התיעוד שלה?'))return;const {error}=await client.from('tasks').delete().eq('id',t.id);if(error)msg(error.message,true);else await load()};r.append(sel,log,del);div.append(h,p,small,r);$('tasks').append(div)}}
$('add').onclick=async()=>{const title=$('title').value.trim();if(!title)return msg('יש להזין כותרת משימה',true);const {error}=await client.from('tasks').insert({title,description:$('description').value.trim(),status:'בטיפול',user_id:user.id});if(error)return msg(error.message,true);$('title').value='';$('description').value='';msg('המשימה נשמרה');await load()};
async function activity(t){const description=prompt('מה בוצע במשימה "'+t.title+'"?');if(!description?.trim())return;const {error}=await client.from('task_activities').insert({task_id:t.id,user_id:user.id,description:description.trim()});if(error)return msg(error.message,true);msg('הטיפול תועד בהצלחה')}
$('reportDate').value=new Date().toLocaleDateString('en-CA');
$('generate').onclick=async()=>{const selected=$('reportDate').value;if(!selected)return msg('בחר תאריך לדוח',true);const [y,m,d]=selected.split('-').map(Number);const endDay=new Date(y,m-1,d+1);let start=new Date(y,m-1,d);let end=endDay;const period=$('period').value;if(period==='week'){const offset=(start.getDay()+6)%7;start.setDate(start.getDate()-offset);end=new Date(start);end.setDate(end.getDate()+7)}if(period==='month'){start=new Date(y,m-1,1);end=new Date(y,m,1)}const {data,error}=await client.from('tasks').select('title,description,status,completed_at').eq('status','הושלם').gte('completed_at',start.toISOString()).lt('completed_at',end.toISOString()).order('completed_at',{ascending:true});if(error)return msg('שגיאה בהפקת הדוח: '+error.message,true);const {data:active,error:activeError}=await client.from('tasks').select('title,status').in('status',['בטיפול','ממתין']);if(activeError)return msg(activeError.message,true);const fmt=x=>x.toLocaleDateString('he-IL');const completed=data||[];const pending=active||[];const lines=['דוח פעילות — מערכות מידע','תקופה: '+fmt(start)+' עד '+fmt(new Date(end.getTime()-86400000)),'','הושלמו בתקופה: '+completed.length,'בטיפול נכון לעכשיו: '+pending.filter(x=>x.status==='בטיפול').length,'ממתינות נכון לעכשיו: '+pending.filter(x=>x.status==='ממתין').length,'','משימות שהושלמו:'];if(!completed.length)lines.push('לא נמצאו משימות שהושלמו בתקופה');for(const t of completed)lines.push('• '+t.title+(t.description?' — '+t.description:''));lines.push('','משימות פעילות (תמונת מצב נוכחית):');if(!pending.length)lines.push('אין משימות פעילות');for(const t of pending)lines.push('• '+t.title+' ('+t.status+')');$('report').value=lines.join('\n');msg('הדוח הופק בהצלחה')};
$('copyReport').onclick=async()=>{if(!$('report').value)return msg('יש להפיק דוח תחילה',true);try{await navigator.clipboard.writeText($('report').value);msg('הדוח הועתק')}catch{ $('report').select();msg('סמן והעתק את הטקסט באמצעות Ctrl+C')}};
$('all').onclick=()=>{filter='הכל';render()};$('refresh').onclick=load;connect();
</script></body></html>
