<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>המשימות שלי V1.5</title><style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f6f8fb;color:#243347;margin:0;font-size:14px}main{max-width:1320px;margin:22px auto;padding:0 16px}section{background:#fff;border:1px solid #e6eaf0;border-radius:10px;padding:16px;margin:12px 0;box-shadow:0 1px 4px #14223b08}h1{font-size:23px;margin:0 0 5px}h2{font-size:16px;margin:0 0 12px}input,textarea,select,button{font:inherit;border:1px solid #d9e0e9;border-radius:6px;padding:8px;box-sizing:border-box}input,textarea{width:100%;margin:5px 0}textarea{min-height:60px}button{cursor:pointer;background:#245b92;color:white;border:0}button.secondary{background:#f1f4f8;color:#2d465e;border:1px solid #e1e6ed}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f4f7fb;border:1px solid #e2e8f0;color:#29445f;padding:12px}.stat b{display:block;font-size:22px}.stat.active{outline:2px solid #9bbad7}.muted{color:#718096;font-size:12px}.hidden{display:none}#message{white-space:pre-wrap}.danger{color:#b12626}.table-scroll{overflow-x:auto;border:1px solid #e7ebf0;border-radius:8px}.task-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px}.task-table th{background:#f7f9fc;color:#62738a;text-align:right;font-size:12px;font-weight:600;padding:9px 10px;border-bottom:1px solid #e5eaf0}.task-table td{padding:6px 10px;border-bottom:1px solid #edf0f4;vertical-align:middle;line-height:1.35}.task-table tbody tr:hover{background:#f9fbfd}.task-table tbody tr:last-child td{border-bottom:0}.task-table .task-title{font-weight:600;color:#24384e}.task-table .desc{color:#65758a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.task-table .date{color:#6b7a8c;white-space:nowrap;font-variant-numeric:tabular-nums}.task-table select{width:100%;min-width:98px;padding:5px 7px;font-size:12px;background:#fff}.task-table button{font-size:12px;padding:5px 8px;white-space:nowrap}.task-table .actions{display:flex;gap:5px;flex-wrap:nowrap}.task-table th:nth-child(1){width:23%}.task-table th:nth-child(2){width:30%}.task-table th:nth-child(3){width:13%}.task-table th:nth-child(4),.task-table th:nth-child(5){width:11%}.task-table th:nth-child(6){width:12%}.empty{padding:20px;text-align:center;color:#7b8998}.compact-form{display:grid;grid-template-columns:1fr 1.6fr auto;gap:10px;align-items:center}.compact-form input,.compact-form textarea{margin:0}.compact-form textarea{min-height:37px;height:37px;resize:vertical}.compact-form button{white-space:nowrap}#signedIn{overflow-wrap:anywhere}@media(max-width:700px){main{padding:0 9px;margin:12px auto}section{padding:12px}.compact-form{grid-template-columns:1fr}.task-table{min-width:850px}.row>*{min-width:0}.stats{gap:6px}.stat{padding:9px}.stat b{font-size:19px}}
</style></head><body><main><h1>המשימות שלי <small class="muted">V1.5</small></h1><p class="muted">ניהול משימות עם שמירה מאובטחת ב־Supabase</p><section id="auth" class="hidden"><h2>התחברות</h2><input id="email" type="email" placeholder="כתובת אימייל"><input id="password" type="password" placeholder="סיסמה"><div class="row"><button id="login">התחבר</button></div></section><div id="app" class="hidden"><section><div class="row"><span id="signedIn"></span><button id="logout" class="secondary">התנתק</button></div></section><section><div class="stats" id="stats"></div></section><section><h2>הוספת משימה</h2><div class="compact-form"><input id="title" placeholder="כותרת המשימה"><textarea id="description" placeholder="תיאור (לא חובה)"></textarea><button id="add">+ הוסף משימה</button></div></section><section><div class="row"><h2>רשימת משימות</h2><button id="all" class="secondary">הצג הכל</button><button id="refresh" class="secondary">רענן</button></div><div class="table-scroll"><table class="task-table"><thead><tr><th>משימה</th><th>תיאור</th><th>סטטוס</th><th>נפתחה</th><th>הושלמה</th><th>פעולות</th></tr></thead><tbody id="tasks"></tbody></table></div></section><section><h2>דוח פעילות</h2><div class="row"><select id="period"><option value="day">יומי</option><option value="week">שבועי</option><option value="month" selected>חודשי</option></select><input type="date" id="reportDate"><button id="generate">הפק דוח</button></div><p class="muted">משימות שהושלמו בתקופה, לצד תמונת מצב נוכחית של משימות פעילות. ללא יומן טיפול, לא ניתן לקבוע אילו משימות פעילות טופלו בפועל בתקופה.</p><textarea id="report" readonly style="min-height:230px" placeholder="הדוח יוצג כאן"></textarea><button id="copyReport" class="secondary">העתק דוח</button></section></div><section id="message" class="muted" role="status"></section></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const PROJECT_URL='https://jufeshcirjwpeseyaxow.supabase.co';
// Set the publishable key once here before uploading to GitHub Pages.
const PUBLISHABLE_KEY='PASTE_YOUR_SB_PUBLISHABLE_KEY_HERE';const $=id=>document.getElementById(id);let client=null,user=null,filter='הכל',items=[];
function msg(t,error=false){$('message').textContent=t;$('message').className=error?'danger':'muted'}
function show(id){for(const x of ['auth','app'])$(x).classList.toggle('hidden',x!==id)}
function connect(){
  if(!PUBLISHABLE_KEY.startsWith('sb_publishable_') && !PUBLISHABLE_KEY.startsWith('eyJ')){
    show('auth');
    $('login').disabled=true;
    msg('חסר Publishable key בקובץ index.html. יש להגדיר אותו פעם אחת בקוד לפני הפרסום.',true);
    return;
  }
  try{
    client=createClient(PROJECT_URL,PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    show('auth');
    client.auth.getUser().then(({data,error})=>{
      if(!error&&data.user)ready(data.user);
      else if(error)msg('יש להתחבר באמצעות מייל וסיסמה');
    }).catch(e=>msg(e.message,true));
  }catch(e){show('auth');msg('שגיאת חיבור: '+e.message,true)}
}
$('login').onclick=async()=>{msg('מתחבר...');const {data,error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return msg(error.message,true);$('password').value='';ready(data.user)};
async function ready(u){user=u;show('app');$('signedIn').textContent=u.email;msg('מחובר');await load()}
$('logout').onclick=async()=>{await client.auth.signOut();user=null;items=[];show('auth');msg('התנתקת בהצלחה')};
async function load(){const {data,error}=await client.from('tasks').select('*').order('created_at',{ascending:false});if(error)return msg('שגיאה בקריאת משימות: '+error.message,true);items=data||[];render()}
function render(){
 const statuses=['בטיפול','ממתין','הושלם'];$('stats').replaceChildren();
 for(const status of statuses){const b=document.createElement('button');b.className='stat'+(filter===status?' active':'');const n=document.createElement('b');n.textContent=items.filter(x=>x.status===status).length;b.append(n,document.createTextNode(status));b.onclick=()=>{filter=filter===status?'הכל':status;render()};$('stats').append(b)}
 $('tasks').replaceChildren();const visible=items.filter(x=>filter==='הכל'||x.status===filter);
 if(!visible.length){const tr=document.createElement('tr');const td=document.createElement('td');td.colSpan=6;td.className='empty';td.textContent='אין משימות להצגה';tr.append(td);$('tasks').append(tr);return}
 const date=v=>v?new Date(v).toLocaleDateString('he-IL'):'—';
 for(const t of visible){const tr=document.createElement('tr');const cell=(value,cls='')=>{const td=document.createElement('td');td.textContent=value;td.className=cls;tr.append(td);return td};
 const title=cell(t.title,'task-title');title.title=t.title;
 const desc=cell(t.description||'—','desc');desc.title=t.description||'';
 const statusTd=cell('');const sel=document.createElement('select');for(const s of statuses){const o=document.createElement('option');o.value=s;o.textContent=s;sel.append(o)}sel.value=t.status;
 sel.onchange=async()=>{sel.disabled=true;const status=sel.value;const {error}=await client.from('tasks').update({status,completed_at:status==='הושלם'?(t.completed_at||new Date().toISOString()):null,updated_at:new Date().toISOString()}).eq('id',t.id);if(error){msg(error.message,true);sel.value=t.status;sel.disabled=false}else await load()};statusTd.append(sel);
 cell(date(t.created_at),'date');cell(date(t.completed_at),'date');
 const act=cell('');const wrap=document.createElement('div');wrap.className='actions';
 const edit=document.createElement('button');edit.textContent='ערוך';edit.className='secondary';edit.onclick=async()=>{const newTitle=prompt('כותרת המשימה',t.title);if(newTitle===null)return;if(!newTitle.trim())return msg('כותרת המשימה לא יכולה להיות ריקה',true);const newDesc=prompt('תיאור המשימה',t.description||'');if(newDesc===null)return;const {error}=await client.from('tasks').update({title:newTitle.trim(),description:newDesc.trim(),updated_at:new Date().toISOString()}).eq('id',t.id);if(error)msg(error.message,true);else await load()};
 const del=document.createElement('button');del.textContent='מחק';del.className='secondary';del.onclick=async()=>{if(!confirm('למחוק את המשימה וכל התיעוד שלה?'))return;const {error}=await client.from('tasks').delete().eq('id',t.id);if(error)msg(error.message,true);else await load()};wrap.append(edit,del);act.append(wrap);$('tasks').append(tr)
 }
}
$('add').onclick=async()=>{const title=$('title').value.trim();if(!title)return msg('יש להזין כותרת משימה',true);const {error}=await client.from('tasks').insert({title,description:$('description').value.trim(),status:'בטיפול',user_id:user.id});if(error)return msg(error.message,true);$('title').value='';$('description').value='';msg('המשימה נשמרה');await load()};
async function activity(t){const description=prompt('מה בוצע במשימה "'+t.title+'"?');if(!description?.trim())return;const {error}=await client.from('task_activities').insert({task_id:t.id,user_id:user.id,description:description.trim()});if(error)return msg(error.message,true);msg('הטיפול תועד בהצלחה')}
$('reportDate').value=new Date().toLocaleDateString('en-CA');
$('generate').onclick=async()=>{const selected=$('reportDate').value;if(!selected)return msg('בחר תאריך לדוח',true);const [y,m,d]=selected.split('-').map(Number);const endDay=new Date(y,m-1,d+1);let start=new Date(y,m-1,d);let end=endDay;const period=$('period').value;if(period==='week'){const offset=(start.getDay()+6)%7;start.setDate(start.getDate()-offset);end=new Date(start);end.setDate(end.getDate()+7)}if(period==='month'){start=new Date(y,m-1,1);end=new Date(y,m,1)}const {data,error}=await client.from('tasks').select('title,description,status,completed_at').eq('status','הושלם').gte('completed_at',start.toISOString()).lt('completed_at',end.toISOString()).order('completed_at',{ascending:true});if(error)return msg('שגיאה בהפקת הדוח: '+error.message,true);const {data:active,error:activeError}=await client.from('tasks').select('title,status').in('status',['בטיפול','ממתין']);if(activeError)return msg(activeError.message,true);const fmt=x=>x.toLocaleDateString('he-IL');const completed=data||[];const pending=active||[];const lines=['דוח פעילות — מערכות מידע','תקופה: '+fmt(start)+' עד '+fmt(new Date(end.getTime()-86400000)),'','הושלמו בתקופה: '+completed.length,'בטיפול נכון לעכשיו: '+pending.filter(x=>x.status==='בטיפול').length,'ממתינות נכון לעכשיו: '+pending.filter(x=>x.status==='ממתין').length,'','משימות שהושלמו:'];if(!completed.length)lines.push('לא נמצאו משימות שהושלמו בתקופה');for(const t of completed)lines.push('• '+t.title+(t.description?' — '+t.description:''));lines.push('','משימות פעילות (תמונת מצב נוכחית):');if(!pending.length)lines.push('אין משימות פעילות');for(const t of pending)lines.push('• '+t.title+' ('+t.status+')');$('report').value=lines.join('\n');msg('הדוח הופק בהצלחה')};
$('copyReport').onclick=async()=>{if(!$('report').value)return msg('יש להפיק דוח תחילה',true);try{await navigator.clipboard.writeText($('report').value);msg('הדוח הועתק')}catch{ $('report').select();msg('סמן והעתק את הטקסט באמצעות Ctrl+C')}};
$('all').onclick=()=>{filter='הכל';render()};$('refresh').onclick=load;connect();
</script></body></html>
