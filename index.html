<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>המשימות שלי V1.7</title><style>
:root{font-family:Arial,"Segoe UI",sans-serif;color:#1d3455;background:#f5f8fe}*{box-sizing:border-box}body{margin:0;font-size:14px;background:linear-gradient(180deg,#f0f5ff 0,#f8faff 250px,#f6f8fc 100%);color:#203753}main{max-width:1450px;margin:0 auto;padding:22px 22px 45px}h1{font-size:30px;letter-spacing:-.6px;margin:0;color:#102d54}h2{font-size:16px;margin:0 0 14px;color:#183e70}p{margin:8px 0 18px}.muted{color:#7186a3;font-size:12px}.hidden{display:none}section{background:#fff;border:1px solid #e2e9f4;border-radius:15px;padding:19px 20px;margin:14px 0;box-shadow:0 4px 22px #274d7c0a}input,textarea,select,button{font:inherit;border:1px solid #dce5f2;border-radius:9px;padding:9px 11px;box-sizing:border-box}input,textarea{width:100%;margin:5px 0;background:#fff}input:focus,textarea:focus,select:focus{outline:2px solid #bcd4ff;outline-offset:1px}textarea{min-height:60px}button{cursor:pointer;background:#2566d8;color:white;border:0;transition:filter .15s,transform .15s}button:hover{filter:brightness(.97)}button.secondary{background:#f4f7fc;color:#315781;border:1px solid #dfe7f2}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.row button{flex:0 0 auto}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{min-height:100px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;text-align:right;border-radius:13px;padding:15px 19px;font-size:14px;font-weight:700;box-shadow:0 2px 10px #24436c0a}.stat b{display:block;font-size:29px;margin-bottom:3px}.stat:nth-child(1){background:#fff1db;color:#a66300;border:1px solid #fce7c4}.stat:nth-child(2){background:#eaf3ff;color:#1e63ba;border:1px solid #d8e7ff}.stat:nth-child(3){background:#e8f8ef;color:#147844;border:1px solid #d0eddf}.stat.active{outline:2px solid #669df3;outline-offset:2px}.danger{color:#b12626}.tabs{display:flex;gap:8px;align-items:center;margin-bottom:14px;border-bottom:1px solid #e2e9f4;padding-bottom:9px}.tab{background:#f4f7fc;color:#416080;border:1px solid #e1e9f4;padding:9px 18px;border-radius:10px;font-weight:700}.tab.selected{background:#e4efff;color:#1c5ab0;border-color:#a8c8f8}.modal-backdrop{position:fixed;inset:0;background:#132b4980;display:flex;align-items:center;justify-content:center;padding:15px;z-index:50}.modal-backdrop.hidden{display:none}.modal{width:min(540px,100%);background:white;border-radius:16px;padding:24px;box-shadow:0 15px 55px #112a4a44}.modal label{display:block;font-weight:700;margin:12px 0 5px}.modal textarea{min-height:145px;resize:vertical}.modal-actions{display:flex;gap:9px;justify-content:flex-start;margin-top:16px}.modal-actions button{min-width:90px}#message{white-space:pre-wrap}.table-scroll{overflow-x:auto;border:1px solid #e1e9f4;border-radius:12px}.task-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px}.task-table th{background:#eaf0f9;color:#3b577b;text-align:right;font-size:12px;font-weight:700;padding:11px 13px;border-bottom:1px solid #dbe5f2}.task-table td{padding:6px 13px;border-bottom:1px solid #e9eef6;vertical-align:middle;line-height:1.35;height:42px}.task-table tbody tr:nth-child(4n+1){background:#ffffff}.task-table tbody tr:nth-child(4n+2){background:#f0f6ff}.task-table tbody tr:nth-child(4n+3){background:#f2fbf7}.task-table tbody tr:nth-child(4n+4){background:#fff7ed}.task-table tbody tr:hover{background:#e4efff}.task-table tbody tr:last-child td{border-bottom:0}.task-table .task-title{font-weight:700;color:#18395e;border-right:3px solid #4e91ed}.task-table .desc{color:#526982;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.task-table .date{color:#61758c;white-space:nowrap;font-variant-numeric:tabular-nums}.task-table select{width:100%;min-width:98px;padding:5px 8px;font-size:12px;font-weight:700;border-radius:25px}.task-table select[data-status="בטיפול"]{background:#fff0d4;color:#aa6900;border-color:#ffe0a6}.task-table select[data-status="ממתין"]{background:#ffe9ed;color:#bb3850;border-color:#f9d5dc}.task-table select[data-status="הושלם"]{background:#ddf5e6;color:#167b43;border-color:#bce9ce}.task-table button{font-size:12px;padding:5px 9px;white-space:nowrap}.task-table .actions{display:flex;gap:6px;flex-wrap:nowrap}.task-table th:nth-child(1){width:24%}.task-table th:nth-child(2){width:29%}.task-table th:nth-child(3){width:13%}.task-table th:nth-child(4),.task-table th:nth-child(5){width:11%}.task-table th:nth-child(6){width:12%}.empty{padding:22px;text-align:center;color:#7b8998}.compact-form{display:grid;grid-template-columns:1fr 1.6fr auto;gap:10px;align-items:center}.compact-form input,.compact-form textarea{margin:0}.compact-form textarea{min-height:39px;height:39px;resize:vertical}.compact-form button{white-space:nowrap}#signedIn{overflow-wrap:anywhere}.page-header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 2px 13px}.page-header p{margin:5px 0 0}.header-icon{font-size:32px;background:#e4efff;padding:10px 14px;border-radius:15px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.section-head h2{margin:0}.section-head .row{justify-content:flex-end}.section-head .row>*{flex:0 0 auto}#auth{max-width:480px;margin:25px auto}#auth input{margin:8px 0}#app>section:first-child{padding:11px 17px}#app>section:nth-child(2){border:0;background:transparent;box-shadow:none;padding:0;margin:15px 0}#report{background:#fafcff;line-height:1.65}@media(max-width:760px){main{padding:12px 10px}section{padding:14px 12px}h1{font-size:24px}.compact-form{grid-template-columns:1fr}.task-table{min-width:860px}.row>*{min-width:0}.stats{gap:7px}.stat{min-height:82px;padding:11px}.stat b{font-size:23px}.section-head{align-items:flex-start;flex-wrap:wrap}.section-head .row{width:100%}}
</style></head><body><main><header class="page-header"><div><h1>המשימות שלי <small class="muted">V1.7</small></h1><p class="muted">ניהול משימות עם שמירה מאובטחת ב־Supabase</p></div><div class="header-icon" aria-hidden="true">☑</div></header><section id="auth" class="hidden"><h2>התחברות</h2><input id="email" type="email" placeholder="כתובת אימייל"><input id="password" type="password" placeholder="סיסמה"><div class="row"><button id="login">התחבר</button></div></section><div id="app" class="hidden"><section><div class="row"><span id="signedIn"></span><button id="logout" class="secondary">התנתק</button></div></section><section><div class="stats" id="stats"></div></section><section><h2>הוספת משימה</h2><div class="compact-form"><input id="title" placeholder="כותרת המשימה"><textarea id="description" placeholder="תיאור (לא חובה)"></textarea><button id="add">+ הוסף משימה</button></div></section><section><div class="section-head"><h2>רשימת משימות</h2><div class="row"><button id="all" class="secondary">הצג הכל</button><button id="refresh" class="secondary">רענן</button></div></div><div class="tabs" role="tablist" aria-label="סוג משימות"><button id="activeTab" class="tab selected" role="tab" aria-selected="true">משימות פעילות</button><button id="completedTab" class="tab" role="tab" aria-selected="false">משימות שהושלמו</button></div><div class="table-scroll"><table class="task-table"><thead><tr><th>משימה</th><th>תיאור</th><th>סטטוס</th><th>נפתחה</th><th>הושלמה</th><th>פעולות</th></tr></thead><tbody id="tasks"></tbody></table></div></section><section><h2>דוח פעילות</h2><div class="row"><select id="period"><option value="day">יומי</option><option value="week">שבועי</option><option value="month" selected>חודשי</option></select><input type="date" id="reportDate"><button id="generate">הפק דוח</button></div><p class="muted">משימות שהושלמו בתקופה, לצד תמונת מצב נוכחית של משימות פעילות. ללא יומן טיפול, לא ניתן לקבוע אילו משימות פעילות טופלו בפועל בתקופה.</p><textarea id="report" readonly style="min-height:230px" placeholder="הדוח יוצג כאן"></textarea><button id="copyReport" class="secondary">העתק דוח</button></section></div><div id="editOverlay" class="modal-backdrop hidden"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="editHeading"><h2 id="editHeading">עריכת משימה</h2><form id="editForm"><label for="editTitle">כותרת המשימה</label><input id="editTitle" required maxlength="500"><label for="editDescription">תיאור המשימה</label><textarea id="editDescription" placeholder="תיאור המשימה"></textarea><div class="modal-actions"><button type="submit" id="saveEdit">שמור שינויים</button><button type="button" id="cancelEdit" class="secondary">ביטול</button></div></form></div></div><section id="message" class="muted" role="status"></section></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const PROJECT_URL='https://jufeshcirjwpeseyaxow.supabase.co';
// Set the publishable key once here before uploading to GitHub Pages.
const PUBLISHABLE_KEY='sb_publishable_JCYqYsQrmCR6JBO2V1QOyA_fbLSrC8D';const $=id=>document.getElementById(id);let client=null,user=null,filter='הכל',items=[],currentTab='active',editingId=null;
function msg(t,error=false){$('message').textContent=t;$('message').className=error?'danger':'muted'}
function show(id){for(const x of ['auth','app'])$(x).classList.toggle('hidden',x!==id)}
function connect(){
  if(!PUBLISHABLE_KEY.startsWith('sb_publishable_') && !PUBLISHABLE_KEY.startsWith('eyJ')){
    show('auth');
    $('login').disabled=true;
    msg('חסר Publishable key בקובץ index.html. יש להגדיר אותו פעם אחת בקוד לפני הפרסום.',true);
    return;
  }
  try{
    client=createClient(PROJECT_URL,PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    show('auth');
    client.auth.getUser().then(({data,error})=>{
      if(!error&&data.user)ready(data.user);
      else if(error)msg('יש להתחבר באמצעות מייל וסיסמה');
    }).catch(e=>msg(e.message,true));
  }catch(e){show('auth');msg('שגיאת חיבור: '+e.message,true)}
}
$('login').onclick=async()=>{msg('מתחבר...');const {data,error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return msg(error.message,true);$('password').value='';ready(data.user)};
async function ready(u){user=u;show('app');$('signedIn').textContent=u.email;msg('מחובר');await load()}
$('logout').onclick=async()=>{await client.auth.signOut();user=null;items=[];show('auth');msg('התנתקת בהצלחה')};
async function load(){const {data,error}=await client.from('tasks').select('*').order('created_at',{ascending:false});if(error)return msg('שגיאה בקריאת משימות: '+error.message,true);items=data||[];render()}
function render(){
 const statuses=['בטיפול','ממתין','הושלם'];$('stats').replaceChildren();
 for(const status of statuses){const b=document.createElement('button');b.className='stat'+(filter===status?' active':'');const n=document.createElement('b');n.textContent=items.filter(x=>x.status===status).length;b.append(n,document.createTextNode(status));b.onclick=()=>{currentTab=status==='הושלם'?'completed':'active';filter=filter===status?'הכל':status;render()};$('stats').append(b)}
 $('activeTab').classList.toggle('selected',currentTab==='active');$('completedTab').classList.toggle('selected',currentTab==='completed');$('activeTab').setAttribute('aria-selected',String(currentTab==='active'));$('completedTab').setAttribute('aria-selected',String(currentTab==='completed'));$('tasks').replaceChildren();const visible=items.filter(x=>(currentTab==='completed'?x.status==='הושלם':x.status!=='הושלם')&&(filter==='הכל'||x.status===filter));
 if(!visible.length){const tr=document.createElement('tr');const td=document.createElement('td');td.colSpan=6;td.className='empty';td.textContent='אין משימות להצגה';tr.append(td);$('tasks').append(tr);return}
 const date=v=>v?new Date(v).toLocaleDateString('he-IL'):'—';
 for(const t of visible){const tr=document.createElement('tr');const cell=(value,cls='')=>{const td=document.createElement('td');td.textContent=value;td.className=cls;tr.append(td);return td};
 const title=cell(t.title,'task-title');title.title=t.title;
 const desc=cell(t.description||'—','desc');desc.title=t.description||'';
 const statusTd=cell('');const sel=document.createElement('select');for(const s of statuses){const o=document.createElement('option');o.value=s;o.textContent=s;sel.append(o)}sel.value=t.status;sel.dataset.status=t.status;
 sel.onchange=async()=>{sel.disabled=true;const status=sel.value;sel.dataset.status=status;const {error}=await client.from('tasks').update({status,completed_at:status==='הושלם'?(t.completed_at||new Date().toISOString()):null,updated_at:new Date().toISOString()}).eq('id',t.id);if(error){msg(error.message,true);sel.value=t.status;sel.dataset.status=t.status;sel.disabled=false}else {filter='הכל';await load()}};statusTd.append(sel);
 cell(date(t.created_at),'date');cell(date(t.completed_at),'date');
 const act=cell('');const wrap=document.createElement('div');wrap.className='actions';
 const edit=document.createElement('button');edit.textContent='ערוך';edit.className='secondary';edit.onclick=()=>{editingId=t.id;$('editTitle').value=t.title;$('editDescription').value=t.description||'';$('editOverlay').classList.remove('hidden');$('editTitle').focus()};
 const del=document.createElement('button');del.textContent='מחק';del.className='secondary';del.onclick=async()=>{if(!confirm('למחוק את המשימה וכל התיעוד שלה?'))return;const {error}=await client.from('tasks').delete().eq('id',t.id);if(error)msg(error.message,true);else await load()};wrap.append(edit,del);act.append(wrap);$('tasks').append(tr)
 }
}
$('add').onclick=async()=>{const title=$('title').value.trim();if(!title)return msg('יש להזין כותרת משימה',true);const {error}=await client.from('tasks').insert({title,description:$('description').value.trim(),status:'בטיפול',user_id:user.id});if(error)return msg(error.message,true);$('title').value='';$('description').value='';msg('המשימה נשמרה');await load()};
async function activity(t){const description=prompt('מה בוצע במשימה "'+t.title+'"?');if(!description?.trim())return;const {error}=await client.from('task_activities').insert({task_id:t.id,user_id:user.id,description:description.trim()});if(error)return msg(error.message,true);msg('הטיפול תועד בהצלחה')}
$('reportDate').value=new Date().toLocaleDateString('en-CA');
$('generate').onclick=async()=>{const selected=$('reportDate').value;if(!selected)return msg('בחר תאריך לדוח',true);const [y,m,d]=selected.split('-').map(Number);const endDay=new Date(y,m-1,d+1);let start=new Date(y,m-1,d);let end=endDay;const period=$('period').value;if(period==='week'){const offset=(start.getDay()+6)%7;start.setDate(start.getDate()-offset);end=new Date(start);end.setDate(end.getDate()+7)}if(period==='month'){start=new Date(y,m-1,1);end=new Date(y,m,1)}const {data,error}=await client.from('tasks').select('title,description,status,completed_at').eq('status','הושלם').gte('completed_at',start.toISOString()).lt('completed_at',end.toISOString()).order('completed_at',{ascending:true});if(error)return msg('שגיאה בהפקת הדוח: '+error.message,true);const {data:active,error:activeError}=await client.from('tasks').select('title,status').in('status',['בטיפול','ממתין']);if(activeError)return msg(activeError.message,true);const fmt=x=>x.toLocaleDateString('he-IL');const completed=data||[];const pending=active||[];const lines=['דוח פעילות — מערכות מידע','תקופה: '+fmt(start)+' עד '+fmt(new Date(end.getTime()-86400000)),'','הושלמו בתקופה: '+completed.length,'בטיפול נכון לעכשיו: '+pending.filter(x=>x.status==='בטיפול').length,'ממתינות נכון לעכשיו: '+pending.filter(x=>x.status==='ממתין').length,'','משימות שהושלמו:'];if(!completed.length)lines.push('לא נמצאו משימות שהושלמו בתקופה');for(const t of completed)lines.push('• '+t.title+(t.description?' — '+t.description:''));lines.push('','משימות פעילות (תמונת מצב נוכחית):');if(!pending.length)lines.push('אין משימות פעילות');for(const t of pending)lines.push('• '+t.title+' ('+t.status+')');$('report').value=lines.join('\n');msg('הדוח הופק בהצלחה')};
$('copyReport').onclick=async()=>{if(!$('report').value)return msg('יש להפיק דוח תחילה',true);try{await navigator.clipboard.writeText($('report').value);msg('הדוח הועתק')}catch{ $('report').select();msg('סמן והעתק את הטקסט באמצעות Ctrl+C')}};
$('activeTab').onclick=()=>{currentTab='active';filter='הכל';render()};$('completedTab').onclick=()=>{currentTab='completed';filter='הכל';render()};$('all').onclick=()=>{filter='הכל';render()};
function closeEdit(){editingId=null;$('editOverlay').classList.add('hidden')}
$('cancelEdit').onclick=closeEdit;
$('editOverlay').onclick=e=>{if(e.target===$('editOverlay'))closeEdit()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&editingId)closeEdit()});
$('editForm').onsubmit=async e=>{e.preventDefault();if(!editingId)return;const title=$('editTitle').value.trim();if(!title)return msg('יש להזין כותרת',true);const save=$('saveEdit');save.disabled=true;try{const {error}=await client.from('tasks').update({title,description:$('editDescription').value.trim(),updated_at:new Date().toISOString()}).eq('id',editingId);if(error)throw error;closeEdit();msg('השינויים נשמרו');await load()}catch(err){msg('שגיאה בשמירה: '+err.message,true)}finally{save.disabled=false}};$('refresh').onclick=load;connect();
</script></body></html>
